[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "voice-forge"
version = "0.1.0"
description = "100% offline voice copilot for terminal developers (Claude Code, Cursor, Git, swarm-pilot)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "voice-forge contributors" }]
keywords = ["voice", "speech-to-text", "whisper", "offline", "cli", "developer-tools", "claude-code", "git"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development",
]
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0.3",
    "rich>=13.7",
    "typer>=0.12",
    "pynput>=1.7.6",
    "pyttsx3>=2.90",
    "pyperclip>=1.8.2",
    "platformdirs>=4.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.2"]
tray = ["pystray>=0.19", "pillow>=10.0"]
bench = ["psutil>=5.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
voice-forge = "voice_forge.cli:main"

[project.urls]
Homepage = "https://github.com/deivycom21-cell/voice-forge"
Issues = "https://github.com/deivycom21-cell/voice-forge/issues"

[tool.hatch.build.targets.wheel]
packages = ["voice_forge"]

[tool.hatch.build.targets.sdist]
include = ["voice_forge", "tests", "scripts", "README.md", "PLAN.md", "CHANGELOG.md", "LICENSE"]

# ---------------------------------------------------------------- tooling
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not model and not mic'"
timeout = 30
markers = [
    "model: requires a downloaded Whisper model",
    "mic: requires a real microphone",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["voice_forge"]
omit = ["voice_forge/ui/tray.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
# E501: the formatter handles wrapping; long lines left are regex grammar tables.
# S110: try/except/pass is used on purpose to probe optional engines.
ignore = ["S101", "E501", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "RUF012", "SIM115"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
